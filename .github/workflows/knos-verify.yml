# .github/workflows/knos-verify.yml: integrations/workflows/knos-verify.yml of Knos 0.3.20, the released action at the
# v0.3.20 commit (it installs knos==0.3.20 from PyPI itself). It was the 0.3.15 rehearsal copy, which took the action
# and a wheel from the staging repository; that repository is private now. One addition: it can also be started by
# hand for a named pull request (workflow_dispatch), to give the verdict of a pull request that is already closed.
name: knos-verify
on:
  pull_request:
    types: [opened, synchronize, reopened, edited, closed]
  workflow_dispatch:
    inputs:
      pull-request:
        description: the pull request's number
        required: true
        type: number
permissions: {}
jobs:
  knos-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      checks: read
      statuses: read
      pull-requests: read
    outputs:
      passed: ${{ steps.knos.outputs.passed }}
      verdict: ${{ steps.knos.outputs.verdict }}
    steps:
      - id: knos
        uses: drexthealpha/Knos/.github/actions/knos-verify@fb77f4fe574d3c0c43d1bd5938f1b309eb6407d7 # v0.3.20
        with:
          pull-request: ${{ inputs.pull-request || github.event.pull_request.number }}
          checks: test          # the names of the checks a bounty's work must pass, as GitHub shows them
