# Knos Gate (from drexthealpha/Knos actions/gate/knos-gate.yml): sealed hidden tests and cheat checks on every pull
# request, with no pull_request_target. Starts on workflow_run after knos-gate-pr.yml, from the default branch; holds
# the hidden tests; never checks out the pull request (the action fetches its head and runs it only in its sandbox).
# Sets the commit status "Knos Gate" on the pull request's head. Only gate_slug.py is in scope.
name: Knos Gate

on:
  workflow_run:
    workflows: ["Knos Gate PR"]
    types: [completed]

permissions: {}

concurrency:
  group: knos-gate-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: true

jobs:
  gate:
    name: Knos Gate
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: write
      statuses: write
    steps:
      - name: the open pull request whose head is the commit that run tested
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          num=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls?state=open&per_page=100" --jq ".[] | select(.head.sha == \"$HEAD\") | .number" | head -1)
          case "$num" in ''|*[!0-9]*) echo "No open pull request has head $HEAD; nothing to gate."; exit 1;; esac
          echo "num=$num" >> "$GITHUB_OUTPUT"
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$HEAD" -f state=pending -f context="Knos Gate" -f description="running" -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > /dev/null
      # the default branch (the base), for the local action and the Knos wheel; never the pull request
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/knos-gate
        id: gate
        with:
          pr: ${{ steps.find.outputs.num }}
          head: ${{ github.event.workflow_run.head_sha }}
          knos-spec: ${{ github.workspace }}/.knos-dist/knos-0.3.28-py3-none-any.whl
          hidden-tests: ${{ secrets.KNOS_GATE_HIDDEN }}
          receipt-key: ${{ secrets.KNOS_RECEIPT_KEY }}
      - name: the commit status "Knos Gate" on the pull request's head
        if: always() && steps.find.outputs.num != ''
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD: ${{ github.event.workflow_run.head_sha }}
          OUTCOME: ${{ steps.gate.outcome }}
        run: |
          state=failure; [ "$OUTCOME" = success ] && state=success
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$HEAD" -f state="$state" -f context="Knos Gate" -f description="$OUTCOME" -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > /dev/null
