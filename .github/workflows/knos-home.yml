# .github/workflows/knos-home.yml: Knos in this repository, from the published workflows' NEW home.
#
# The same two callers as knos.yml (the command job and the settle job), naming drexthealpha/Knos (branch `workflows`,
# the same commit 96b243f1 that knos-workflows published) instead of drexthealpha/knos-workflows. An escrow pins the
# repository and commit of the workflow that funded it, and only prove.yml of that repository at that commit pays it,
# so each escrow is settled by the home it pinned:
#   - this file answers only issues labelled `knos-home`, and settles only a push whose commit message has
#     [knos-home] in it (or a run started by hand with a merged pull request's number);
#   - knos.yml (the old home) skips exactly those, and keeps doing everything else as before.
# Added on 15 Oct 2026 for the first live devnet payment through the new home (Knos CUTOVER-0331 section 1, step 4;
# internal dogfooding, test money only).
name: knos home

on:
  issue_comment:
    types: [created]
  issues:
    types: [opened]
  push:
    branches: ["**"]        # the settle job's condition keeps the default branch only
  workflow_dispatch:
    inputs:
      pull:
        description: Number of the merged pull request whose payment to try again
        required: true
        type: number

permissions: {}

jobs:
  command:
    name: knos command
    if: >-
      contains(github.event.issue.labels.*.name, 'knos-home') && (
      (github.event_name == 'issue_comment' &&
       (startsWith(github.event.comment.body, '/knos') || contains(github.event.comment.body, fromJSON('"\n/knos"')))) ||
      (github.event_name == 'issues' &&
       (contains(github.event.issue.body, '/knos fund') || contains(github.event.issue.body, '/knos bounty'))))
    permissions:
      contents: read
      issues: write
      pull-requests: write
      checks: read
      statuses: read
      actions: read
      id-token: write
    uses: drexthealpha/Knos/.github/workflows/fund.yml@96b243f1b1dd5c975a0318dd9709a0da22b98dcd

  settle:
    name: knos settle
    needs: command
    if: >-
      !cancelled() && (
        (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
         contains(github.event.head_commit.message, '[knos-home]')) ||
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'issue_comment' && needs.command.outputs.settle != ''))
    permissions:
      contents: read
      issues: write
      pull-requests: write
      checks: read
      statuses: read
      actions: read
      id-token: write
    uses: drexthealpha/Knos/.github/workflows/prove.yml@96b243f1b1dd5c975a0318dd9709a0da22b98dcd
