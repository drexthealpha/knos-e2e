# Knos Gate, first half (from drexthealpha/Knos actions/gate/knos-gate-pr.yml): the pull request's own code, public
# tests only, no secret, a read-only token. knos-gate.yml starts on workflow_run when this completes.
name: Knos Gate PR

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: knos-gate-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  public:
    name: Knos Gate PR
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: setup and the public tests, as the base commit's .knos/gate.yml names them
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git show "$BASE:.knos/gate.yml" > "$RUNNER_TEMP/gate.yml"
          python3 -m pip install --quiet pyyaml
          read_key() {
            python3 -c '
          import sys, yaml
          v = yaml.safe_load(open(sys.argv[1])) or {}
          for k in sys.argv[2].split("."):
              v = v.get(k) if isinstance(v, dict) else None
          print(v or "")' "$RUNNER_TEMP/gate.yml" "$1"
          }
          setup="$(read_key setup)"; public="$(read_key public_tests.command)"
          [ -z "$setup" ] || bash -c "$setup"
          [ -z "$public" ] || bash -c "$public"
